<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" />

  <!-- Book / Bible Base -->
  <path d="M 140 340 Q 256 310 372 340 L 372 370 Q 256 340 140 370 Z" fill="rgba(255,255,255,0.2)" />

  <!-- Microphone & Sparkle Symbol -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Mic Body -->
    <rect x="-36" y="-80" width="72" height="120" rx="36" fill="#ffffff" />
    <path d="M -36 -40 L 36 -40 M -36 0 L 36 0" stroke="#8b5cf6" stroke-width="4" opacity="0.4" />
    
    <!-- Mic Stand -->
    <path d="M -60 -10 C -60 70 60 70 60 -10" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <path d="M 0 55 L 0 95" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <path d="M -40 95 L 40 95" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- AI Sparkles -->
  <path d="M 370 140 L 380 165 L 405 175 L 380 185 L 370 210 L 360 185 L 335 175 L 360 165 Z" fill="url(#accentGrad)" />
  <path d="M 140 160 L 145 175 L 160 180 L 145 185 L 140 200 L 135 185 L 120 180 L 135 175 Z" fill="#ffffff" opacity="0.8" />
</svg>
