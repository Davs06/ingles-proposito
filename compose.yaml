# Compose para testes e desenvolvimento LOCAL (Sem Traefik)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ingles_proposito_backend_local
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ingles_proposito_frontend_local
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://mock-edusocial.supabase.co}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-mock-anon-key}
      - VITE_BACKEND_URL=http://localhost:4000/api
    depends_on:
      - backend
